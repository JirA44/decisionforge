name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: python -m compileall -q src/decisionforge tests
      - name: Vérifier OpenAPI 3.1 et la version
        shell: bash
        run: >-
          python -c "import pathlib,yaml; d=yaml.safe_load(pathlib.Path('docs/openapi.yaml').read_text(encoding='utf-8'));
          assert d['openapi']=='3.1.0'; assert d['info']['version']=='1.0.6';
          assert '/v1/decision-change-attribution-dossiers' in d['paths']"

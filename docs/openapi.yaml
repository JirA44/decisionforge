openapi: 3.1.0
info:
  title: DecisionForge API
  description: Registre immuable de décisions, recommandations déterministes, analyses
    bornées de sensibilité, comparaisons, consensus, calibration et stabilité chronologique
    recalculés à partir des preuves persistées, avec attribution chronologique des
    changements. La couverture des critères est également qualifiée sur des séries
    compatibles.
  version: 1.0.7
paths:
  /health:
    get:
      tags:
      - system
      summary: Health
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /info:
    get:
      tags:
      - system
      summary: Info
      operationId: info_info_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /v1/decisions:
    get:
      tags:
      - decisions
      summary: List Decisions
      operationId: list_decisions_v1_decisions_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/DecisionSnapshot'
                type: array
                title: Response List Decisions V1 Decisions Get
    post:
      tags:
      - decisions
      summary: Create Decision
      operationId: create_decision_v1_decisions_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecisionCreate'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionSnapshot'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/decisions/{decision_id}:
    get:
      tags:
      - decisions
      summary: Get Decision
      operationId: get_decision_v1_decisions__decision_id__get
      parameters:
      - name: decision_id
        in: path
        required: true
        schema:
          type: string
          title: Decision Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionSnapshot'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'

components:
  schemas:
    AlternativeComparison:
      properties:
        alternative_key:
          type: string
          title: Alternative Key
        baseline_rank:
          anyOf:
          - type: integer
          - type: 'null'
          title: Baseline Rank
        candidate_rank:
          anyOf:
          - type: integer
          - type: 'null'
          title: Candidate Rank
        rank_change:
          anyOf:
          - type: integer
          - type: 'null'
          title: Rank Change
        baseline_score:
          type: number
          title: Baseline Score
        candidate_score:
          type: number
          title: Candidate Score
        score_change:
          type: number
          title: Score Change
        baseline_coverage:
          type: number
          title: Baseline Coverage
        candidate_coverage:
          type: number
          title: Candidate Coverage
        coverage_change:
          type: number
          title: Coverage Change
        eligibility_changed:
          type: boolean
          title: Eligibility Changed
      additionalProperties: false
      type: object
      required:
      - alternative_key
      - baseline_rank
      - candidate_rank
      - rank_change
      - baseline_score
      - candidate_score
      - score_change
      - baseline_coverage
      - candidate_coverage
      - coverage_change
      - eligibility_changed
      title: AlternativeComparison
    AlternativeCreate:
      properties:
        key:
          type: string
          maxLength: 64
          minLength: 1
          pattern: ^[A-Za-z][A-Za-z0-9_-]*$
          title: Key
        label:
          type: string
          maxLength: 200
          minLength: 1
          title: Label
        description:
          type: string
          maxLength: 2000
          title: Description
          default: ''
      additionalProperties: false
      type: object
      required:
      - key
      - label
      title: AlternativeCreate
    AuditEvent:
      properties:
        sequence:
          type: integer
          title: Sequence
        event_type:
          type: string
          title: Event Type
        entity_type:
          type: string
          title: Entity Type
        entity_id:
          type: string
          title: Entity Id
        payload:
          additionalProperties: true
          type: object
          title: Payload
        created_at:
          type: string
          title: Created At
      type: object
      required:
      - sequence
      - event_type
      - entity_type
      - entity_id
      - payload
      - created_at
      title: AuditEvent
    CalibrationBin:
      properties:
        index:
          type: integer
          title: Index
        lower_bound:
          type: number
          title: Lower Bound
        upper_bound:
          type: number
          title: Upper Bound
        count:
          type: integer
          title: Count
        average_confidence:
          anyOf:
          - type: number
          - type: 'null'
          title: Average Confidence
        observed_accuracy:
          anyOf:
          - type: number
          - type: 'null'
          title: Observed Accuracy
        calibration_gap:
          anyOf:
          - type: number
          - type: 'null'
          title: Calibration Gap
      additionalProperties: false
      type: object
      required:
      - index
      - lower_bound
      - upper_bound
      - count
      - average_confidence
      - observed_accuracy
      - calibration_gap
      title: CalibrationBin
    CalibrationDossier:
      properties:
        id:
          type: string
          title: Id
        evaluation_ids:
          items:
            type: string
          type: array
          title: Evaluation Ids
        method:
          type: string
          title: Method
        qualification:
          type: string
          enum:
          - CALIBRATED
          - MISALIGNED
          - INSUFFICIENT
          - INCOMPATIBLE
          title: Qualification
        compatible:
          type: boolean
          title: Compatible
        evaluation_count:
          type: integer
          title: Evaluation Count
        usable_evaluation_count:
          type: integer
          title: Usable Evaluation Count
        coverage:
          type: number
          title: Coverage
        brier_score:
          anyOf:
          - type: number
          - type: 'null'
          title: Brier Score
        bounded_log_loss:
          anyOf:
          - type: number
          - type: 'null'
          title: Bounded Log Loss
        expected_calibration_error:
          anyOf:
          - type: number
          - type: 'null'
          title: Expected Calibration Error
        resolution:
          anyOf:
          - type: number
          - type: 'null'
          title: Resolution
        worst_bin_index:
          anyOf:
          - type: integer
          - type: 'null'
          title: Worst Bin Index
        evaluations:
          items:
            $ref: '#/components/schemas/CalibrationEvaluation'
          type: array
          title: Evaluations
        bins:
          items:
            $ref: '#/components/schemas/CalibrationBin'
          type: array
          title: Bins
        explanations:
          items:
            type: string
          type: array
          title: Explanations
        input_hash:
          type: string
          title: Input Hash
        dossier_hash:
          type: string
          title: Dossier Hash
        reproducible:
          type: boolean
          title: Reproducible
          default: true
        idempotent_replay:
          type: boolean
          title: Idempotent Replay
          default: false
        immutable:
          type: boolean
          title: Immutable
          default: true
        created_at:
          type: string
          title: Created At
        warning:
          type: string
          title: Warning
          default: Ce dossier mesure une calibration historique. Il ne prédit pas
            une performance future et ne déclenche, n'approuve ni n'autorise aucune
            action.
      additionalProperties: false
      type: object
      required:
      - id
      - evaluation_ids
      - method
      - qualification
      - compatible
      - evaluation_count
      - usable_evaluation_count
      - coverage
      - brier_score
      - bounded_log_loss
      - expected_calibration_error
      - resolution
      - worst_bin_index
      - evaluations
      - bins
      - explanations
      - input_hash
      - dossier_hash
      - created_at
      title: CalibrationDossier
    CalibrationDossierCreate:
      properties:
        evaluation_ids:
          items:
            type: string
          type: array
          maxItems: 500
          minItems: 3
          title: Evaluation Ids
      additionalProperties: false
      type: object
      required:
      - evaluation_ids
      title: CalibrationDossierCreate
    CalibrationEvaluation:
      properties:
        evaluation_id:
          type: string
          title: Evaluation Id
        decision_id:
          type: string
          title: Decision Id
        predicted_alternative_key:
          type: string
          title: Predicted Alternative Key
        observed_alternative_key:
          type: string
          title: Observed Alternative Key
        confidence:
          type: number
          title: Confidence
        observed_probability:
          type: number
          title: Observed Probability
        correct:
          type: boolean
          title: Correct
        recomputed_outcome_hash:
          type: string
          title: Recomputed Outcome Hash
      additionalProperties: false
      type: object
      required:
      - evaluation_id
      - decision_id
      - predicted_alternative_key
      - observed_alternative_key
      - confidence
      - observed_probability
      - correct
      - recomputed_outcome_hash
      title: CalibrationEvaluation
    ConsensusAlternative:
      properties:
        alternative_key:
          type: string
          title: Alternative Key
        recommendation_count:
          type: integer
          title: Recommendation Count
        recommendation_share:
          type: number
          title: Recommendation Share
        average_rank:
          anyOf:
          - type: number
          - type: 'null'
          title: Average Rank
        rank_dispersion:
          anyOf:
          - type: number
          - type: 'null'
          title: Rank Dispersion
        average_score:
          type: number
          title: Average Score
        score_dispersion:
          type: number
          title: Score Dispersion
        minimum_coverage:
          type: number
          title: Minimum Coverage
        eligible_count:
          type: integer
          title: Eligible Count
        eligible_share:
          type: number
          title: Eligible Share
        all_eligible:
          type: boolean
          title: All Eligible
      additionalProperties: false
      type: object
      required:
      - alternative_key
      - recommendation_count
      - recommendation_share
      - average_rank
      - rank_dispersion
      - average_score
      - score_dispersion
      - minimum_coverage
      - eligible_count
      - eligible_share
      - all_eligible
      title: ConsensusAlternative
    ConsensusDossier:
      properties:
        id:
          type: string
          title: Id
        evaluation_ids:
          items:
            type: string
          type: array
          title: Evaluation Ids
        method:
          type: string
          title: Method
        evaluation_method:
          type: string
          title: Evaluation Method
        qualification:
          type: string
          enum:
          - CONSENSUS
          - STABLE_MAJORITY
          - DIVIDED
          - INSUFFICIENT
          - INCOMPATIBLE
          title: Qualification
        compatible:
          type: boolean
          title: Compatible
        evaluation_count:
          type: integer
          title: Evaluation Count
        sufficient_evaluation_count:
          type: integer
          title: Sufficient Evaluation Count
        majority_alternative_key:
          anyOf:
          - type: string
          - type: 'null'
          title: Majority Alternative Key
        majority_share:
          type: number
          title: Majority Share
        evaluations:
          items:
            $ref: '#/components/schemas/RecomputedEvaluationSnapshot'
          type: array
          title: Evaluations
        alternatives:
          items:
            $ref: '#/components/schemas/ConsensusAlternative'
          type: array
          title: Alternatives
        minimum_winner_margin:
          anyOf:
          - type: number
          - type: 'null'
          title: Minimum Winner Margin
        explanations:
          items:
            type: string
          type: array
          title: Explanations
        input_hash:
          type: string
          title: Input Hash
        dossier_hash:
          type: string
